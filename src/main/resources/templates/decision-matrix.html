<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OptiChoice - Decision Matrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; font-family: sans-serif; }
        .header-box { background: #14376c; color: white; padding: 2rem; border-radius: 0 0 20px 20px; }
    </style>
</head>
<body>
<div class="header-box text-center">
    <h2 th:text="${domain.name} + ' Decision Evaluation'">Domain Matrix</h2>
    <p th:text="${domain.description}" class="mb-0 text-light"></p>
</div>

<div class="container my-5" style="max-width: 800px;">
    <form th:action="@{/calculate}" method="post" class="card shadow p-4 border-0">
        <input type="hidden" name="domain" th:value="${domain.name}">

        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <label class="form-label fw-bold">Option A Name</label>
                <input type="text" name="optionA" class="form-control" placeholder="e.g. Intern at Startup" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Option B Name</label>
                <input type="text" name="optionB" class="form-control" placeholder="e.g. Research Assistantship" required>
            </div>
        </div>

        <h5 class="fw-bold mb-3">Rate Criteria (Score: 1–10 | Importance Weight: 1–5)</h5>

        <div th:each="crit, stat : ${criteriaList}" class="border rounded p-3 mb-3 bg-light">
            <h6 class="fw-bold text-primary" th:text="${crit}">Criterion</h6>
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label small">Option A Score (1-10)</label>
                    <input type="number" name="scoresA" min="1" max="10" value="5" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Option B Score (1-10)</label>
                    <input type="number" name="scoresB" min="1" max="10" value="5" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Importance Weight (1-5)</label>
                    <input type="number" name="weights" min="1" max="5" value="3" class="form-control" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg mt-3 w-100">Analyze & Calculate Recommendation</button>
    </form>
</div>
</body>
</html>
