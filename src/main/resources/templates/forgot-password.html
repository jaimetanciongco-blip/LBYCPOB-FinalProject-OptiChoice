<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiChoice - Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand-logo">OptiChoice</a>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a th:href="@{/about}">About Us</a></li>
        <li><a href="/login" class="active">Log In</a></li>
    </ul>
</nav>

<main class="main-container">
    <div class="login-card">
        <h2>Change Password</h2>

        <p th:if="${error}" th:text="${error}" style="color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem;"></p>

        <form th:action="@{/forgot-password}" method="post">
            <div class="labeled-field">
                <label for="username">Name</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter Username" required>
            </div>

            <div class="labeled-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email Address" required>
            </div>

            <div class="password-row">
                <div class="labeled-field">
                    <label for="newPassword">New Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePassword('newPassword', this)"></i>
                    </div>
                </div>

                <div class="labeled-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Reset Password</button>
        </form>

        <p class="signup-text">
            or <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</main>



<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
</body>
</html>
