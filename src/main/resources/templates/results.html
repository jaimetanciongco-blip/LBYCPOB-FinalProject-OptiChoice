<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OptiChoice - Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; font-family: sans-serif; }
        .winner-card { background: #d4edda; border: 2px solid #28a745; border-radius: 12px; padding: 2rem; }
    </style>
</head>
<body>
<div class="container my-5" style="max-width: 800px;">
    <div class="winner-card text-center mb-4 shadow-sm">
        <h4 class="text-success fw-bold">🎯 Optimal Choice Recommended</h4>
        <h1 class="display-4 fw-bold mt-2" th:text="${winner.optionName}">Winner</h1>
        <p class="lead">Achieved a total weighted score of: <strong th:text="${winner.calculatedScore}"></strong></p>
    </div>

    <div class="card shadow border-0 p-4">
        <h4 class="fw-bold mb-3">Decision Matrix Ranking</h4>
        <table class="table table-striped table-hover mb-4">
            <thead class="table-dark">
            <tr>
                <th>Rank</th>
                <th>Choice Name</th>
                <th>Final Weighted Score</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="choice, stat : ${rankedChoices}">
                <td class="fw-bold" th:text="'#' + ${stat.count}">#1</td>
                <td th:text="${choice.optionName}">Option</td>
                <td th:text="${choice.calculatedScore}">0.0</td>
            </tr>
            </tbody>
        </table>

        <div class="text-center">
            <a th:href="@{/categories}" class="btn btn-primary me-2">Evaluate Another Decision</a>
            <a th:href="@{/history}" class="btn btn-outline-secondary">View Decision Archive</a>
        </div>
    </div>
</div>
</body>
</html>
