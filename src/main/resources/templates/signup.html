<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiChoice - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand-logo">OptiChoice</a>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a th:href="@{/about}">About Us</a></li>
        <li><a href="/login">Log In</a></li>
    </ul>
</nav>

<main class="main-container">
    <div class="login-card">
        <h2>Sign up</h2>

        <p th:if="${error}" th:text="${error}" style="color: #dc2626; font-size: 0.85rem; margin-bottom: 1.2rem; font-weight: 500;"></p>

        <form th:action="@{/signup}" method="post">
            <div class="form-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>

            <div class="form-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>

            <div class="form-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="signup-password" name="password" class="form-control" placeholder="Password" required>
                <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('signup-password', this)"></i>
            </div>

            <div class="form-group" style="margin-bottom: 1.8rem;">
                <i class="fa-solid fa-shield-halved input-icon"></i>
                <input type="password" id="confirm-password" name="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('confirm-password', this)"></i>
            </div>

            <button type="submit" class="btn-submit">Sign up</button>
        </form>

        <p class="signup-text">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</main>

<script>
    function togglePasswordVisibility(fieldId, iconElement) {
        const field = document.getElementById(fieldId);
        if (field.type === 'password') {
            field.type = 'text';
            iconElement.classList.remove('fa-eye');
            iconElement.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            iconElement.classList.remove('fa-eye-slash');
            iconElement.classList.add('fa-eye');
        }
    }
</script>
</body>
</html>
