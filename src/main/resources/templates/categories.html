<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OptiChoice - Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #16386d 0%, #0a1f42 100%); min-height: 100vh; color: white; font-family: sans-serif; }
        .cat-card { border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; font-weight: bold; color: #111; padding: 25px 15px; display: block; text-align: center; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .bg-academic { background-color: #b9d8ee; }
        .bg-prof { background-color: #c9e8dc; }
        .bg-fin { background-color: #b7e9b1; }
        .bg-health { background-color: #f7cece; }
        .bg-social { background-color: #f7dfb0; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">OptiChoice</span>
    <div>
        <a th:href="@{/history}" class="btn btn-outline-light btn-sm me-2">History Archive</a>
        <a th:href="@{/login}" class="btn btn-light btn-sm">Log Out</a>
    </div>
</nav>

<div class="container text-center mt-5">
    <h2 class="fw-bold mb-2">What kind of decision are you facing today?</h2>
    <p class="text-light mb-5">Select a category domain to customize your evaluation matrix.</p>

    <div class="row g-3 justify-content-center">
        <div class="col-md-2 col-6">
            <a th:href="@{/matrix(domain='academic')}" class="cat-card bg-academic">
                <div class="fs-2 mb-2">🎓</div>
                <span>ACADEMIC</span>
            </a>
        </div>
        <div class="col-md-2 col-6">
            <a th:href="@{/matrix(domain='professional')}" class="cat-card bg-prof">
                <div class="fs-2 mb-2">💼</div>
                <span>PROFESSIONAL</span>
            </a>
        </div>
        <div class="col-md-2 col-6">
            <a th:href="@{/matrix(domain='financial')}" class="cat-card bg-fin">
                <div class="fs-2 mb-2">💰</div>
                <span>FINANCIAL</span>
            </a>
        </div>
        <div class="col-md-2 col-6">
            <a th:href="@{/matrix(domain='health')}" class="cat-card bg-health">
                <div class="fs-2 mb-2">❤️</div>
                <span>HEALTH</span>
            </a>
        </div>
        <div class="col-md-2 col-6">
            <a th:href="@{/matrix(domain='social')}" class="cat-card bg-social">
                <div class="fs-2 mb-2">👥</div>
                <span>SOCIAL</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
