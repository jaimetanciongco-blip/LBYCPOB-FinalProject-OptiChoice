<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiChoice - Categories</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>


<nav class="navbar">
    <a href="/categories" class="brand-logo">OptiChoice</a>
    <div class="nav-actions">
        <a th:href="@{/history}" class="btn-nav-outline">History Archive</a>
        <a th:href="@{/logout}" class="btn-nav-solid">Log Out</a>
    </div>
</nav>

<div class="page-header">
    <h1>What kind of decision are you facing today?</h1>
    <p>Select a category domain to customize your evaluation matrix.</p>
</div>

<main class="categories-container">
    <a th:href="@{/matrix(domain='academic')}" class="category-card cat-academic">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>ACADEMIC</span>
    </a>

    <a th:href="@{/matrix(domain='professional')}" class="category-card cat-professional">
        <i class="fa-solid fa-briefcase"></i>
        <span>PROFESSIONAL</span>
    </a>

    <a th:href="@{/matrix(domain='financial')}" class="category-card cat-financial">
        <i class="fa-solid fa-sack-dollar"></i>
        <span>FINANCIAL</span>
    </a>

    <a th:href="@{/matrix(domain='health')}" class="category-card cat-health">
        <i class="fa-solid fa-heart"></i>
        <span>HEALTH</span>
    </a>

    <a th:href="@{/matrix(domain='social')}" class="category-card cat-social">
        <i class="fa-solid fa-users"></i>
        <span>SOCIAL</span>
    </a>
</main>

</body>
</html>
