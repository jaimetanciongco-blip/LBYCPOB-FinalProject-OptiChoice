<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OptiChoice - Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1d4b8f 0%, #0d234a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .auth-card { background: #fff; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .btn-custom { background-color: #0b1a30; color: #fff; }
        .btn-custom:hover { background-color: #14376c; color: #fff; }
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="text-center fw-bold mb-4">Log in</h3>
    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-custom w-100 py-2">Log in</button>
    </form>
    <p class="text-center mt-3 small text-muted">or <a th:href="@{/signup}" class="text-decoration-none fw-bold">Sign up</a></p>
</div>
</body>
</html>
