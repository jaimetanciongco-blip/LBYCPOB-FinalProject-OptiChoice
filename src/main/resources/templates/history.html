<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OptiChoice - Decision Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f4f7fb; font-family: sans-serif; }</style>
</head>
<body>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Decision History Archive</h3>
        <a th:href="@{/categories}" class="btn btn-primary btn-sm">+ New Decision</a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Domain Category</th>
                    <th>Options Compared</th>
                    <th>Recommended Choice</th>
                    <th>Score</th>
                    <th>Date & Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${archives}">
                    <td th:text="${item.id}">1</td>
                    <td><span class="badge bg-primary" th:text="${item.domainName}">Domain</span></td>
                    <td th:text="${item.optionA} + ' vs ' + ${item.optionB}">A vs B</td>
                    <td class="fw-bold text-success" th:text="${item.winningChoice}">Winner</td>
                    <td th:text="${item.winningScore}">0.0</td>
                    <td th:text="${#temporals.format(item.decidedAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
